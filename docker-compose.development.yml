name: zeppelin-dev

volumes:
  home: {}
  untrusted-home: {}
  mysql-data: {}
  redis-data: {}
  caddy-data: {}

services:
  caddy:
    image: caddy:2
    pull_policy: daily
    ports:
      - "${DEVELOPMENT_BIND_HOST:-127.0.0.1}:${DEVELOPMENT_WEB_PORT:?Missing DEVELOPMENT_WEB_PORT}:443"
      - "${DEVELOPMENT_BIND_HOST:-127.0.0.1}:${DEVELOPMENT_PORTAL_PORT:?Missing DEVELOPMENT_PORTAL_PORT}:444"
    volumes:
      - ./docker/development/caddy/config:/etc/caddy
      - caddy-data:/data
      # Mount host tailscale dir for tailscale cert support
      # Creates an empty dir on host if it doesn't already exist
      # Probably doesn't work on Windows but who cares
      - type: bind
        source: /var/run/tailscale
        target: /var/run/tailscale
        read_only: true
        bind:
          create_host_path: true

  mysql:
    image: mysql:8
    pull_policy: daily
    environment:
      MYSQL_ROOT_PASSWORD: ${DEVELOPMENT_MYSQL_ROOT_PASSWORD?:Missing DEVELOPMENT_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: zeppelin
      MYSQL_USER: zeppelin
      MYSQL_PASSWORD: ${DEVELOPMENT_MYSQL_PASSWORD?:Missing DEVELOPMENT_MYSQL_PASSWORD}
    ports:
      - "${DEVELOPMENT_BIND_HOST:-127.0.0.1}:${DEVELOPMENT_MYSQL_PORT:?Missing DEVELOPMENT_MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:8
    pull_policy: daily
    volumes:
      - redis-data:/data

  devenv:
    build: &devenv-build
      context: ./docker/development/devenv
    init: true
    environment:
      DEVELOPMENT_SSH_PASSWORD: ${DEVELOPMENT_SSH_PASSWORD:?Missing DEVELOPMENT_SSH_PASSWORD}
    ports:
      - "${DEVELOPMENT_BIND_HOST:-127.0.0.1}:${DEVELOPMENT_SSH_PORT:?Missing DEVELOPMENT_SSH_PORT}:22"
    volumes:
      - home:/home/dev
      - ./:/workspace/zeppelin
    healthcheck:
      test: ["CMD", "test", "-e", "/run/uid-ready"]
      interval: 30s
      start_period: 30s
      start_interval: 200ms

  # Utility container to run untrusted applications
  # without sharing the main devenv's container and home dir
  untrusted:
    profiles: [manual]
    build: *devenv-build
    volumes:
      - untrusted-home:/home/dev
      - ./:/workspace/zeppelin

  cftunnel:
    profiles: [cftunnel]
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
